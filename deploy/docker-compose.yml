# Jiska — app Next.js + PostgreSQL, servie sur https://jiska.duckdns.org.
# L'app écoute en :80 sur le réseau Docker `web` (convention du VPS) ;
# le HTTPS public est géré par le Caddy global (bloc `jiska.duckdns.org`).
# La base n'est PAS exposée sur `web` : elle vit sur le réseau interne `back`.
# Copier .env.example vers .env et choisir un mot de passe avant le premier lancement.

name: jiska

services:
  jiska-app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
    container_name: jiska-app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://jiska:${POSTGRES_PASSWORD}@jiska-db:5432/jiska
      # Analyse des comptes rendus de réunion (import de transcript).
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      # Clerk porte l'identité ; Jiska garde les rôles et les droits.
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /login
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: /register
      NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL: /app
      NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL: /app
    depends_on:
      jiska-db:
        condition: service_healthy
    mem_limit: 512m
    pids_limit: 256
    networks:
      - web
      - back

  jiska-db:
    image: postgres:17-alpine
    container_name: jiska-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: jiska
      POSTGRES_USER: jiska
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - jiska-db-data:/var/lib/postgresql/data
    # Check toutes les 60 s (chaque exec coûte cher en CPU sur ce VPS) ;
    # start_interval garde un démarrage rapide pour le depends_on de l'app.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jiska -d jiska"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
      start_interval: 2s
    mem_limit: 512m
    pids_limit: 256
    networks:
      - back

volumes:
  jiska-db-data:

networks:
  web:
    external: true
  back:
